<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Map Studio V15 - Ultimate Control</title>
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; overflow: hidden; background: #111; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        
        /* UI Panel */
        #ui-panel {
            position: absolute; top: 20px; left: 20px; width: 370px; /* Un peu plus large pour les boutons */
            background: rgba(18, 18, 24, 0.98); color: #eee;
            padding: 20px; border-radius: 12px;
            backdrop-filter: blur(15px); z-index: 20000;
            max-height: 92vh; overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            font-size: 13px;
        }
        #ui-panel::-webkit-scrollbar { width: 6px; }
        #ui-panel::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
        
        h2 { margin: 0 0 15px 0; font-size: 20px; color: white; display: flex; justify-content: space-between; align-items: center;}
        h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; margin: 25px 0 10px 0; color: #00d2ff; border-bottom: 1px solid #333; padding-bottom: 4px; font-weight: 700;}

        .control-group { margin-bottom: 15px; }
        input[type="text"], input[type="file"] { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #333; background: #222; color: white; box-sizing: border-box; outline: none; margin-bottom: 5px; }
        input[type="text"]:focus { border-color: #00d2ff; }

        .btn-grid { display: flex; gap: 8px; margin-bottom: 5px; }
        button { flex: 1; padding: 10px; border-radius: 6px; border: none; background: #333; color: white; cursor: pointer; transition: 0.2s; font-weight: 600; font-size: 12px; }
        button:hover { background: #444; transform: translateY(-1px); }
        button.primary { background: #00d2ff; color: #000; }
        button.active { background: #fff; color: #000; box-shadow: 0 0 10px white; }
        button.record { background: #ff4757; color: white; }
        button.save { background: #2ecc71; color: #000; }
        button.load { background: #f1c40f; color: #000; }

        .search-box { display: flex; gap: 5px; margin-bottom: 10px; }
        .search-box button { flex: 0 0 40px; background: #00d2ff; color: black; }

        .save-load-area { display: flex; gap: 10px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #333;}
        .color-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; background: #222; padding: 5px 10px; border-radius: 6px;}
        input[type="color"] { -webkit-appearance: none; border: none; width: 24px; height: 24px; padding: 0; background: none; cursor: pointer;}
        input[type="range"] { width: 100px; cursor: pointer; }

        /* --- MARQUEURS --- */
        .marker-back-container { width: 0; height: 0; overflow: visible; position: relative; z-index: 1 !important; }
        .marker-dot { width: 12px; height: 12px; background: #00d2ff; border: 2px solid white; border-radius: 50%; box-shadow: 0 0 8px #00d2ff; position: absolute; top: 0; left: 0; transform: translate(-50%, -50%); z-index: 10; }
        .marker-line { width: 2px; background: rgba(255,255,255,0.7); position: absolute; bottom: 0; left: 0; transform-origin: bottom center; display: none; pointer-events: none; z-index: 1; }

        .marker-front-container { width: 0; height: 0; overflow: visible; position: relative; display: flex; flex-direction: column; align-items: center; }
        .marker-content-wrapper { will-change: transform; transition: transform 0.1s linear; display: flex; flex-direction: column; align-items: center; }

        .marker-image { width: 80px; height: 80px; background-size: contain; background-repeat: no-repeat; background-position: center; filter: drop-shadow(1.5px 0 0 white) drop-shadow(-1.5px 0 0 white) drop-shadow(0 1.5px 0 white) drop-shadow(0 -1.5px 0 white) drop-shadow(0 5px 15px rgba(0,0,0,0.6)); transition: transform 0.2s cubic-bezier(0.3, 1.5, 0.5, 1); position: relative; z-index: 20; transition: opacity 0.3s; }
        .marker-image:hover { transform: scale(1.15); z-index: 9999 !important; }

        .marker-label { margin-top: 5px; font-size: 15px; font-weight: 900; color: black; text-align: center; white-space: nowrap; text-shadow: 2px 0 0 white, -2px 0 0 white, 0 2px 0 white, 0 -2px 0 white, 1px 1px 0 white, -1px -1px 0 white, 1px -1px 0 white, -1px 1px 0 white; position: relative; z-index: 30; pointer-events: none; transition: opacity 0.3s; }
        
        .hidden { opacity: 0 !important; visibility: hidden; }
        .display-none { display: none !important; }

        /* LISTE ITEMS */
        .list-item { background: #25252a; margin-bottom: 5px; padding: 8px; border-radius: 6px; border-left: 3px solid #444; display: flex; align-items: center; gap: 5px; }
        .list-item input { margin: 0; border: none; background: transparent; font-weight: bold; width: 100%; color:#ddd; font-size:12px;}
        .list-item input:focus { background: #333; color:white; }
        
        .action-btns { display: flex; gap: 2px; margin-left: auto; }
        .mini-btn { padding: 4px 6px; font-size: 12px; cursor: pointer; color: #aaa; background: #333; border-radius: 3px; border:none; display:flex; align-items:center; justify-content:center; min-width: 22px;}
        .mini-btn:hover { background: #555; color: white; }
        .del-btn { color: #ff4757; }
        .del-btn:hover { background: #500; }
        .toggle-btn.inactive { color: #555; opacity: 0.5; } 

        #hide-ui-btn { position: absolute; top: 20px; right: 20px; z-index: 20001; padding: 10px 20px; background: rgba(0,0,0,0.5); border: 1px solid white; color: white; cursor: pointer;}
    </style>
</head>
<body>

<div id="map"></div>
<button id="hide-ui-btn" onclick="toggleUI()">👁️ Interface</button>

<div id="ui-panel">
    <div class="save-load-area">
        <button class="save" onclick="saveProject()">💾 Sauver</button>
        <button class="load" onclick="document.getElementById('file-input').click()">📂 Ouvrir</button>
        <input type="file" id="file-input" accept=".json" style="display:none" onchange="loadProject(this)">
    </div>

    <div class="control-group">
        <h3>Navigation</h3>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Ville, Lieu, Adresse...">
            <button onclick="searchLocation()">Go</button>
        </div>
    </div>

    <div class="control-group">
        <h3>Style et Frontières</h3>
        <div class="btn-grid" style="margin-bottom:8px;">
            <button id="btn-sat" onclick="switchStyle('satellite')" class="primary">🌍 Satellite</button>
            <button id="btn-plan" onclick="switchStyle('plan')">📐 Plan 3D</button>
        </div>
        <div id="plan-colors" style="display:none; margin-bottom:8px;">
            <div class="color-row"><span>Sol</span> <input type="color" id="color-land" value="#e0e0e0" oninput="updateColors()"></div>
            <div class="color-row"><span>Eau</span> <input type="color" id="color-water" value="#a0cfdf" oninput="updateColors()"></div>
        </div>
        
        <input type="text" id="country-iso" placeholder="Frontières (ex: FR, CN, US)" value="CN">
        
        <div class="color-row">
            <span>Couleur</span> 
            <input type="color" id="border-color" value="#ff0000" oninput="updateBorderColor(this.value)">
        </div>
        <div class="color-row">
            <span>Opacité</span>
            <input type="range" id="border-opacity" min="0.1" max="1" step="0.1" value="1" oninput="updateBorderOpacity(this.value)">
        </div>
        <div class="btn-grid" style="margin-top:5px;">
            <button id="btn-border-solid" class="active" onclick="toggleBorderDash(false)">Trait Plein</button>
            <button id="btn-border-dashed" onclick="toggleBorderDash(true)">Pointillés</button>
        </div>

        <div class="btn-grid" style="margin-top:10px;">
            <button class="primary" onclick="drawBorders()">Surligner</button>
            <button onclick="clearBorders()">Effacer</button>
        </div>
    </div>

    <div class="control-group">
        <h3>Logos et Textes</h3>
        <div class="btn-grid" style="margin-bottom:10px;">
            <button onclick="document.getElementById('logo-upload').click()" style="border:1px dashed #666; background:transparent;">+ Ajouter Logo</button>
        </div>
        <input type="file" id="logo-upload" accept="image/*" style="display:none;">
        <div id="markers-list" style="margin-top:10px;"></div>
    </div>

    <div class="control-group">
        <h3>Vidéo</h3>
        <button class="primary" onclick="addKeyframe()">+ Ajouter Keyframe</button>
        <div id="keyframes-list" style="margin-top:5px;"></div>
        <div style="margin-top:15px; background:#222; padding:10px; border-radius:8px;">
            <label style="font-size:10px;">Vitesse</label>
            <input type="range" id="speed-range" min="0.1" max="2" step="0.1" value="0.5" style="width:100%;">
            <button class="record" onclick="playScene()" style="margin-top:5px;">▶️ Action</button>
        </div>
    </div>
</div>

<script>
    // --- CLÉ API CONFIGURÉE ---
    mapboxgl.accessToken = 'pk.eyJ1IjoiY3lhbm9pZGUiLCJhIjoiY21pcHVkY2F2MGY5ZzNnczlrbmdpZmE4cCJ9.35yvKuoVzQQrEzGhC2d63Q'; 
    // --------------------------

    let currentStyle = 'satellite';
    let markers = []; 
    let keyframes = [];
    let pendingImage = null;
    let physicsInterval = null;
    let borderDashed = false; 

    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/satellite-streets-v12',
        center: [121.47, 31.23], zoom: 6, pitch: 20, projection: 'globe' 
    });

    map.on('style.load', () => {
        addTerrain();
        if(currentStyle === 'plan') applyPlanSettings();
        const isos = document.getElementById('country-iso').value;
        if(isos) drawBorders(false);
    });

    function addTerrain() {
        if (!map.getSource('mapbox-dem')) {
            map.addSource('mapbox-dem', { 'type': 'raster-dem', 'url': 'mapbox://mapbox.mapbox-terrain-dem-v1', 'tileSize': 512, 'maxzoom': 14 });
        }
        map.setTerrain({ 'source': 'mapbox-dem', 'exaggeration': 1.5 });
    }

    // --- NAVIGATION ---
    async function searchLocation() {
        const query = document.getElementById('search-input').value;
        if(!query) return;
        const url = `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(query)}.json?access_token=${mapboxgl.accessToken}`;
        try {
            const res = await fetch(url);
            const data = await res.json();
            if(data.features && data.features.length > 0) {
                map.flyTo({ center: data.features[0].center, zoom: 12, essential: true });
            }
        } catch(e) { console.error(e); }
    }

    // --- MOTEUR PHYSIQUE ---
    function startPhysics() {
        if (physicsInterval) clearInterval(physicsInterval);
        physicsInterval = setInterval(() => {
            // Hiérarchie Z-Index
            markers.forEach((m, index) => {
                if(m.markerFront.getElement()) {
                    // Les derniers dans la liste sont devant (Z + index)
                    m.markerFront.getElement().style.zIndex = (10000 + index).toString();
                }
                if(m.markerBack.getElement()) m.markerBack.getElement().style.zIndex = "1";
            });

            if (markers.length < 2) return;

            markers.forEach(m => { 
                const pos = map.project(m.lngLat);
                m.x = pos.x; m.y = pos.y;
                if (!m.forceX) { m.forceX = 0; m.forceY = 0; }
                m.forceX *= 0.85; m.forceY *= 0.85; 
            });

            const RADIUS = 90;
            for (let i = 0; i < markers.length; i++) {
                // Si le logo est masqué (logoVisible = false), on peut choisir de désactiver sa collision
                // Ici, je garde la collision active si au moins un des deux (logo ou texte) est visible
                // pour éviter que ça saute quand on réactive.
                if(!markers[i].logoVisible && !markers[i].textVisible) continue; 

                for (let j = i + 1; j < markers.length; j++) {
                    if(!markers[j].logoVisible && !markers[j].textVisible) continue;
                    
                    let m1 = markers[i]; let m2 = markers[j];
                    let dx = (m2.x + m2.forceX) - (m1.x + m1.forceX);
                    let dy = (m2.y + m2.forceY) - (m1.y + m1.forceY);
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < RADIUS && dist > 0) {
                        let overlap = RADIUS - dist;
                        let angle = Math.atan2(dy, dx);
                        let moveX = Math.cos(angle) * overlap * 0.5;
                        let moveY = Math.sin(angle) * overlap * 0.5;
                        m1.forceX -= moveX; m1.forceY -= moveY;
                        m2.forceX += moveX; m2.forceY += moveY;
                    }
                }
            }

            markers.forEach(m => {
                const contentWrapper = m.markerFront.getElement().querySelector('.marker-content-wrapper');
                if (contentWrapper) contentWrapper.style.transform = `translate(${m.forceX}px, ${m.forceY}px)`;
                
                const line = m.markerBack.getElement().querySelector('.marker-line');
                const dist = Math.sqrt(m.forceX*m.forceX + m.forceY*m.forceY);
                
                // On affiche la ligne seulement si le logo ou le texte est visible
                const isSomethingVisible = m.logoVisible || m.textVisible;

                if (dist > 5 && isSomethingVisible) {
                    line.style.display = 'block';
                    const angle = Math.atan2(m.forceY, m.forceX) * (180/Math.PI) - 90;
                    line.style.height = `${dist}px`;
                    line.style.transform = `rotate(${angle}deg)`;
                } else {
                    line.style.display = 'none';
                }
            });
        }, 1000/60);
    }
    startPhysics();

    // --- GESTION MARQUEURS ---
    document.getElementById('logo-upload').addEventListener('change', (e) => {
        if(e.target.files[0]) {
            const r = new FileReader();
            r.onload = (ev) => { pendingImage = ev.target.result; map.getCanvas().style.cursor = 'copy'; };
            r.readAsDataURL(e.target.files[0]);
        }
    });
    map.on('click', (e) => {
        if (pendingImage) {
            addMarkerToMap(e.lngLat, pendingImage, "Repère " + (markers.length + 1));
            pendingImage = null;
            map.getCanvas().style.cursor = '';
            document.getElementById('logo-upload').value = '';
        }
    });

    function addMarkerToMap(lngLat, imgUrl, labelText) {
        const elBack = document.createElement('div');
        elBack.className = 'marker-back-container';
        elBack.innerHTML = `<div class="marker-dot"></div><div class="marker-line"></div>`;
        const markerBack = new mapboxgl.Marker({ element: elBack, anchor: 'center' }).setLngLat(lngLat).addTo(map);

        const elFront = document.createElement('div');
        elFront.className = 'marker-front-container';
        elFront.innerHTML = `
            <div class="marker-content-wrapper">
                <div class="marker-image" style="background-image:url('${imgUrl}')"></div>
                <div class="marker-label">${labelText}</div>
            </div>
        `;
        const markerFront = new mapboxgl.Marker({ element: elFront, anchor: 'bottom' }).setLngLat(lngLat).addTo(map);

        markers.push({ 
            id: Date.now(), 
            markerBack: markerBack, 
            markerFront: markerFront, 
            lngLat: lngLat, 
            img: imgUrl, 
            label: labelText,
            logoVisible: true, // Nouveau
            textVisible: true  // Nouveau
        });
        updateMarkerUI();
    }

    function updateMarkerUI() {
        const list = document.getElementById('markers-list');
        list.innerHTML = '';
        markers.forEach((m, i) => {
            const div = document.createElement('div');
            div.className = 'list-item';
            
            // Icones d'état
            const logoClass = m.logoVisible ? 'toggle-btn' : 'toggle-btn inactive';
            const textClass = m.textVisible ? 'toggle-btn' : 'toggle-btn inactive';
            
            div.innerHTML = `
                <img src="${m.img}" style="width:20px; height:20px; object-fit:contain;">
                <input type="text" value="${m.label}" oninput="updateLabel(${i}, this.value)">
                <div class="action-btns">
                     <button class="mini-btn" onclick="moveMarker(${i}, -1)" title="Monter (Arrière)">⬆️</button>
                    <button class="mini-btn" onclick="moveMarker(${i}, 1)" title="Descendre (Avant)">⬇️</button>
                    <button class="mini-btn ${logoClass}" onclick="toggleLogo(${i})" title="Afficher/Masquer Logo">🖼️</button>
                    <button class="mini-btn ${textClass}" onclick="toggleText(${i})" title="Afficher/Masquer Texte">T</button>
                    <button class="mini-btn del-btn" onclick="removeMarker(${i})">✖</button>
                </div>
            `;
            list.appendChild(div);
        });
    }

    function moveMarker(index, direction) {
        if (index + direction < 0 || index + direction >= markers.length) return;
        const temp = markers[index];
        markers[index] = markers[index + direction];
        markers[index + direction] = temp;
        updateMarkerUI();
    }

    function updateLabel(index, val) {
        markers[index].label = val;
        markers[index].markerFront.getElement().querySelector('.marker-label').innerText = val;
    }

    // --- TOGGLES INDIVIDUELS ---
    function toggleLogo(index) {
        markers[index].logoVisible = !markers[index].logoVisible;
        const imgEl = markers[index].markerFront.getElement().querySelector('.marker-image');
        if(markers[index].logoVisible) imgEl.classList.remove('hidden');
        else imgEl.classList.add('hidden');
        updateMarkerUI();
    }

    function toggleText(index) {
        markers[index].textVisible = !markers[index].textVisible;
        const txtEl = markers[index].markerFront.getElement().querySelector('.marker-label');
        if(markers[index].textVisible) txtEl.classList.remove('hidden');
        else txtEl.classList.add('hidden');
        updateMarkerUI();
    }

    function removeMarker(index) {
        markers[index].markerBack.remove();
        markers[index].markerFront.remove();
        markers.splice(index, 1);
        updateMarkerUI();
    }

    // --- FRONTIÈRES ---
    function drawBorders(force = true) {
        const input = document.getElementById('country-iso').value;
        const color = document.getElementById('border-color').value;
        const opacity = document.getElementById('border-opacity').value;
        
        if (!input && !force) return;
        const codes = input.split(',').map(c => c.trim().toUpperCase());
        if (map.getLayer('custom-borders')) map.removeLayer('custom-borders');
        if (!map.isStyleLoaded()) return;
        
        // Style "Civ" : [4, 4]
        const dashArray = borderDashed ? [4, 4] : [1, 0]; 

        map.addLayer({
            'id': 'custom-borders', 'type': 'line',
            'source': { 'type': 'vector', 'url': 'mapbox://mapbox.country-boundaries-v1' },
            'source-layer': 'country_boundaries',
            'layout': { 'line-join': 'round', 'line-cap': 'round' },
            'paint': { 
                'line-color': color, 
                'line-width': 4, 
                'line-blur': 1,
                'line-opacity': parseFloat(opacity),
                'line-dasharray': dashArray
            },
            'filter': ['in', 'iso_3166_1', ...codes]
        });
    }

    function updateBorderColor(color) { 
        if (map.getLayer('custom-borders')) map.setPaintProperty('custom-borders', 'line-color', color); 
    }
    
    function updateBorderOpacity(val) {
        if (map.getLayer('custom-borders')) map.setPaintProperty('custom-borders', 'line-opacity', parseFloat(val));
    }

    function toggleBorderDash(isDashed) {
        borderDashed = isDashed;
        document.getElementById('btn-border-solid').className = isDashed ? '' : 'active';
        document.getElementById('btn-border-dashed').className = isDashed ? 'active' : '';
        if (map.getLayer('custom-borders')) {
             map.setPaintProperty('custom-borders', 'line-dasharray', isDashed ? [4, 4] : [1, 0]);
        }
    }

    function clearBorders() { if (map.getLayer('custom-borders')) map.removeLayer('custom-borders'); }

    // --- KEYFRAMES ---
    function addKeyframe() {
        const c = map.getCenter();
        const label = "Plan " + (keyframes.length + 1);
        keyframes.push({center:[c.lng,c.lat], zoom:map.getZoom(), pitch:map.getPitch(), bearing:map.getBearing(), label: label});
        updateKeys();
    }
    function updateKeys() {
        const l = document.getElementById('keyframes-list'); l.innerHTML = '';
        keyframes.forEach((k, i) => {
            l.innerHTML += `
                <div class="list-item">
                    <input type="text" value="${k.label}" oninput="keyframes[${i}].label = this.value">
                    <div class="action-btns">
                        <button class="mini-btn" onclick="moveKey(${i}, -1)">⬆️</button>
                        <button class="mini-btn" onclick="moveKey(${i}, 1)">⬇️</button>
                        <button class="mini-btn del-btn" onclick="keyframes.splice(${i},1);updateKeys()">✖</button>
                    </div>
                </div>`;
        });
    }
    function moveKey(index, direction) {
        if (index + direction < 0 || index + direction >= keyframes.length) return;
        const temp = keyframes[index];
        keyframes[index] = keyframes[index + direction];
        keyframes[index + direction] = temp;
        updateKeys();
    }
    async function playScene() {
        if(keyframes.length<2) return alert("2 plans minimum !");
        const s = parseFloat(document.getElementById('speed-range').value);
        map.jumpTo(keyframes[0]);
        await new Promise(r=>setTimeout(r,1000));
        for(let i=1; i<keyframes.length; i++) {
            await new Promise(res => { map.flyTo({...keyframes[i], speed:0.5*s, essential:true}); map.once('moveend', res); });
        }
    }

    // --- SAVE/LOAD ---
    function switchStyle(style) {
        currentStyle = style;
        document.getElementById('plan-colors').style.display = style === 'plan' ? 'block' : 'none';
        document.getElementById('btn-sat').className = style === 'satellite' ? 'primary' : '';
        document.getElementById('btn-plan').className = style === 'plan' ? 'primary' : '';
        if (style === 'satellite') { map.setStyle('mapbox://styles/mapbox/satellite-streets-v12'); map.setProjection('globe'); }
        else { map.setStyle('mapbox://styles/mapbox/light-v10'); map.setProjection('mercator'); }
    }
    function applyPlanSettings() {
        if(currentStyle !== 'plan') return;
        updateColors();
        if (!map.getLayer('3d-buildings')) {
            const layers = map.getStyle().layers;
            const labelLayerId = layers.find(l => l.type === 'symbol' && l.layout['text-field'])?.id;
            map.addLayer({
                'id': '3d-buildings', 'source': 'composite', 'source-layer': 'building',
                'filter': ['==', 'extrude', 'true'], 'type': 'fill-extrusion', 'minzoom': 12,
                'paint': { 'fill-extrusion-color': '#aaa', 'fill-extrusion-height': ['get', 'height'], 'fill-extrusion-opacity': 0.6 }
            }, labelLayerId);
        }
    }
    function updateColors() {
        if (currentStyle !== 'plan') return;
        const land = document.getElementById('color-land').value;
        const water = document.getElementById('color-water').value;
        if(map.getLayer('background')) map.setPaintProperty('background', 'background-color', land);
        if(map.getLayer('water')) map.setPaintProperty('water', 'fill-color', water);
    }
    function saveProject() {
        const data = {
            style: currentStyle,
            borders: { 
                codes: document.getElementById('country-iso').value, 
                color: document.getElementById('border-color').value,
                opacity: document.getElementById('border-opacity').value,
                dashed: borderDashed
            },
            colors: { land: document.getElementById('color-land').value, water: document.getElementById('color-water').value },
            keyframes: keyframes, 
            markersData: markers.map(m => ({ 
                lngLat: m.lngLat, 
                img: m.img, 
                label: m.label, 
                logoVisible: m.logoVisible, // Sauvegarde état Logo
                textVisible: m.textVisible  // Sauvegarde état Texte
            }))
        };
        const blob = new Blob([JSON.stringify(data)], {type: "application/json"});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "projet_map_v15.json"; a.click();
    }
    function loadProject(input) {
        const file = input.files[0]; if(!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            const data = JSON.parse(e.target.result);
            switchStyle(data.style);
            
            document.getElementById('country-iso').value = data.borders.codes;
            document.getElementById('border-color').value = data.borders.color || '#ff0000';
            document.getElementById('border-opacity').value = data.borders.opacity || '1';
            toggleBorderDash(data.borders.dashed || false);
            document.getElementById('color-land').value = data.colors.land;
            document.getElementById('color-water').value = data.colors.water;
            
            markers.forEach(m => { m.markerBack.remove(); m.markerFront.remove(); }); markers = [];
            data.markersData.forEach(m => {
                addMarkerToMap(m.lngLat, m.img, m.label);
                const lastIdx = markers.length - 1;
                // Restauration Logo
                markers[lastIdx].logoVisible = (m.logoVisible !== undefined) ? m.logoVisible : true;
                if(!markers[lastIdx].logoVisible) markers[lastIdx].markerFront.getElement().querySelector('.marker-image').classList.add('hidden');
                // Restauration Texte
                markers[lastIdx].textVisible = (m.textVisible !== undefined) ? m.textVisible : true;
                if(!markers[lastIdx].textVisible) markers[lastIdx].markerFront.getElement().querySelector('.marker-label').classList.add('hidden');
            });
            updateMarkerUI();

            keyframes = data.keyframes || []; updateKeys();
            setTimeout(() => drawBorders(), 1000);
        };
        reader.readAsText(file);
    }
    function toggleUI() {
        const ui = document.getElementById('ui-panel');
        ui.style.display = ui.style.display === 'none' ? 'block' : 'none';
    }
</script>
</body>
</html>
